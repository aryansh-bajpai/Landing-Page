<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2><u>Contact Form</u></h2>

  <form action="#" method="POST">

    <label for="fullName">Full Name:</label>
    <input type="text" id="fullName" name="fullName" required><br>

    <label for="contactNumber">Contact Number:</label>
    <input type="tel" id="contactNumber" name="contactNumber" required><br>

    <label for="address">Address:</label>
    <textarea id="address" name="address" rows="4" cols="50" required></textarea><br>

    <label for="companyName">Company Name:</label>
    <input type="text" id="companyName" name="companyName"><br>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required><br>

    <label for="department">Department:</label>
    <select id="department" name="department">
      <option value="">--Select--</option>
      <option value="HR">HR</option>
      <option value="Sales">Sales</option>
      <option value="Development">Development</option>
      <option value="Marketing">Marketing</option>
      <option value="Others">Others</option>
    </select><br>

    <label>Gender:</label>
    <input type="radio" id="male" name="gender" value="Male">
    <label for="male">Male</label>

    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label>

    <input type="radio" id="na" name="gender" value="Prefer not to say">
    <label for="na">Prefer not to say</label>``

    <input type="submit" value="Submit">

  </form>

</body>
</html>
